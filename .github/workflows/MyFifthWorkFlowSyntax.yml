name: My-Fourth-BranchNPull-Workflow
# to get a trigger on every push in this repo in any branch
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  
env:
  APP_USER: jm
  APP_PORT: 80
  
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Step-1 - see dir. info
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step-2 - checkout
        uses: actions/checkout@v7
  job3:
    name: job3
    runs-on: ubuntu-latest
    steps:
      - name: referring context or in-buildvariables
        run: |
          echo "[INFO] Triggered by ${{ github.event_name }}."
          echo "[INFO] Triggered by ${{ github.actor }} in ${{ github.ref_name }} branch."
          echo "[INFO] Varabile: $APP_USER"
          echo "[INFO] Current step is running on ${{ runner.os }}"
          echo "[INFO] Current JOB ID is ${{ job.check_run_id }}"
    

  
