name: My-Second-Workflow
# to get a trigger on every push in this repo in any branch
on:
  push:

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Step-1 - see dir. info
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step-2 - checkout
        uses: actions/checkout@v7
      - name: Step-3 - checkout dir. info
        run: |
          pwd
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          ls -ltr
          echo `ls -ltr` >> artifacts/list.txt
          echo `hostname` >> artifacts/hostname.txt
      - name: Upload single file
        uses: actions/upload-artifact@v7
        with:
          name: single_file
          path: ./myartifact.txt
      - name: Upload from Directory
        uses: actions/upload-artifact@v7
        with:
          name: directory_artifacts
          path: artifacts/
      - name: Upload from Multiple paths with Exclusion
        uses: actions/upload-artifact@v7
        with:
          name: multiple_paths_with_exclusions
          path: |
            ./myartifact.txt
            artifacts/
            !**/hostname.txt
  job2:
    name: JOB2
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: checking current directory
        run: |
          pwd
          ls -ltr
      - name: Download single file artifact
        uses: actions/download-artifact@v8.0.2
        with:
          # Name of the artifact to download. If unspecified, all artifacts for the run are downloaded.
          name: single_file
      - name: Checking current directory post download
        run: |
          pwd
          ls -ltr
  job3:
    name: JOB3
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: checking current directory
        run: |
          pwd
          ls -ltr
      - name: Download Directory
        uses: actions/download-artifact@v8.0.2
        with:
          # Name of the artifact to download. If unspecified, all artifacts for the run are downloaded.
          name: directory_artifacts
      - name: Checking current directory post download
        run: |
          pwd
          ls -ltr
      
      
        
          
          
