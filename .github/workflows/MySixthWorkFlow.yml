name: My-6th-BranchNPull-Workflow
# to get a trigger on every push in this repo in any branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Running Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Steup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Unit Tests
        run: |
          mkdir reports/
          pytest --junitxml=reports/unit-test-results.xml --cov=. --cov=report.xml --cov-report=term-missing -v
      - name: upload code Coverage Report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unitcode-coverage-report
          path: reports/
            
        
  
