name: my-first-workflow
# To get triggered on every push in this repo in any branch
on: push

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Running Single Command in Job1
        run: echo "Hi this is my first GitHub workflow"
      - name: Running OS Release for GitHub Hosted Runner
        run: cat /etc/os-release
      - name: Calling sleep
        run: sleep 20        
  job2:
    name: JOB2
    runs-on: ubuntu-latest
    steps:
      - name: Checking the hostname for runner
        run: hostname
      - name: running multiple commands
        run: |
          echo "Hi from JoseM"
          echo "current time is `date`"
          sleep 20
    
    
    
